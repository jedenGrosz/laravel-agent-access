name: checks
on: [push, pull_request]
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, pdo_sqlite
          coverage: none
      - run: composer require --dev "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.laravel == '12' && '10' || '11' }}.0" --no-update
      - run: composer update --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: composer check
  databases:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [pgsql, mysql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agent_access
          POSTGRES_USER: agent_access
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U agent_access" --health-interval=2s --health-retries=30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: agent_access
          MYSQL_USER: agent_access
          MYSQL_PASSWORD: local-test-only
          MYSQL_ROOT_PASSWORD: local-root-test-only
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -u root -plocal-root-test-only" --health-interval=2s --health-retries=60
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, pdo_pgsql, pdo_mysql
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: composer test
        env:
          LAA_DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.database == 'pgsql' && '5432' || '3306' }}
          DB_USERNAME: agent_access
          DB_PASSWORD: local-test-only
  passport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, pdo_sqlite, sodium
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: composer create-project laravel/laravel .test-results/passport-consumer '13.*' --prefer-dist --no-interaction --no-scripts
      - name: Configure disposable Passport host
        working-directory: .test-results/passport-consumer
        run: |
          composer config repositories.agent-access path ../..
          composer require laravel-agent-access/laravel-agent-access:@dev 'laravel/passport:^13.0' laravel/mcp:1.0.1 --no-interaction --no-scripts
      - run: php tests/Support/passport-smoke.php
